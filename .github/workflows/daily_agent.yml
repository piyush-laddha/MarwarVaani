name: MarwarVaani Daily Agent

on:
  schedule:
    # 07:48 AM IST (Indian Standard Time, UTC+5:30) = 02:18 AM UTC (off-peak minute)
    - cron: '18 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  run-daily-agent:
    name: Generate & Publish Daily Marwari Card
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run MarwarVaani Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GCP_CREDENTIALS_JSON: ${{ secrets.GCP_CREDENTIALS_JSON }}
          GOOGLE_SHEET_NAME: ${{ secrets.GOOGLE_SHEET_NAME }}
          GOOGLE_DOC_ID: ${{ secrets.GOOGLE_DOC_ID }}
          CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
        run: |
          python MarwarVaani_Agent.py --save-log

      - name: Commit & Push Web Archive Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/cards.json
          if git diff --staged --quiet; then
            echo "No new cards to commit to web archive."
          else
            git commit -m "Auto-archive daily card for $(date +'%Y-%m-%d') [skip ci]"
            git push
          fi
